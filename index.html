<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4EDDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фармакология">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Тест по фармакологии</title>
<meta name="description" content="Тренажёр по фармакологии: тесты, рецепты на латыни, справочник препаратов. Работает без интернета.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- шрифты подключаются без блокировки первого кадра: пока они не пришли (или нет сети), показывается запасной шрифт -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Golos+Text:wght@400;500;600;800&family=Marck+Script&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Golos+Text:wght@400;500;600;800&family=Marck+Script&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p style="font:16px/1.4 sans-serif;padding:24px;text-align:center">Для работы приложения нужен включённый JavaScript.</p></noscript>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <button class="btn-back" id="backBtn" type="button" data-act="up" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span id="backLabel">Меню</span></button>
      <div class="topbar-title" id="topTitle"></div>
      <div class="top-actions" aria-hidden="true"></div>
    </div>
    <div class="topbar-sub" id="topSub" hidden>
      <div class="progress"><i id="progressFill"></i></div>
      <div class="score" id="score" hidden><span class="score-ok" id="scoreOk"></span><span class="score-no" id="scoreNo"></span></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>
<div id="sheetRoot"></div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="data.js"></script>
<script src="recipe-bot.js"></script>
<script src="app.js"></script>
</body>
</html>
