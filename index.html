<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFBF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фармакология">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Тест по фармакологии</title>
<meta name="description" content="Тренажёр по фармакологии: тесты, рецепты на латыни, справочник препаратов. Работает без интернета.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="icons/splash-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- шрифты подключаются без блокировки первого кадра: пока они не пришли (или нет сети), показывается запасной шрифт -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Golos+Text:wght@400;500;600;800&family=Marck+Script&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Golos+Text:wght@400;500;600;800&family=Marck+Script&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<script>try{if(localStorage.getItem("pharma-theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.content="#0F131C"}}catch(e){}</script>
<script>
/* Заставка-продолжение: показывается только в установленном приложении (или по адресу ?splash=1 — для проверки в браузере) */
try{if(sessionStorage.getItem("pharma-splash-shown")==="1")document.documentElement.classList.add("no-splash");else sessionStorage.setItem("pharma-splash-shown","1")}catch(e){}
try{var q=/[?&]splash=1/.test(location.search),sa=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
if(!(q||sa)||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))document.documentElement.classList.add("no-splash")}catch(e){document.documentElement.classList.add("no-splash")}
</script>
<style>
/* Заставка. Системная заставка Android — иконка из манифеста по центру на фоне background_color (#FAFBF8).
   Здесь тот же кадр: тот же фон и та же иконка (белый квадрат --splash-box с картинкой --splash-size внутри; размеры сняты со скриншота системной заставки, 1 dp = 1 px CSS), поэтому переход незаметен. Дальше иконка уменьшается,
   а фон плавно приходит к цвету выбранной темы (в светлой теме цвет тот же, меняется только иконка). */
:root{--splash-bg:#FAFBF8;--splash-to:#FAFBF8;--splash-box:240px;--splash-size:208px;--splash-hold:.2s;--splash-dur:.6s}
html[data-theme="dark"]{--splash-to:#0F131C}
#splash{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:var(--splash-bg);pointer-events:none}
#splash img{box-sizing:content-box;width:var(--splash-size);height:var(--splash-size);padding:calc((var(--splash-box) - var(--splash-size)) / 2);background:#fff;display:block}
html.no-splash #splash{display:none}
#splash.go{animation:splashBg var(--splash-dur) cubic-bezier(.45,0,.25,1) var(--splash-hold) forwards}
#splash.go img{animation:splashIcon var(--splash-dur) cubic-bezier(.55,0,.7,.35) var(--splash-hold) forwards}
@keyframes splashBg{to{background-color:var(--splash-to)}}
@keyframes splashIcon{to{transform:scale(0)}}
</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-dark.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icons/splash-icon.png" alt="" width="512" height="512" decoding="sync"></div>
<noscript><p style="font:16px/1.4 sans-serif;padding:24px;text-align:center">Для работы приложения нужен включённый JavaScript.</p></noscript>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <button class="btn-back" id="backBtn" type="button" data-act="up" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span id="backLabel">Меню</span></button>
      <div class="topbar-title" id="topTitle"></div>
      <div class="top-actions" aria-hidden="true"></div>
    </div>
    <div class="topbar-sub" id="topSub" hidden>
      <div class="progress"><i id="progressFill"></i></div>
      <div class="score" id="score" hidden><span class="score-ok" id="scoreOk"></span><span class="score-no" id="scoreNo"></span></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>
<div id="sheetRoot"></div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="data.js"></script>
<script src="recipe-bot.js"></script>
<script src="app.js"></script>
<script>
/* Анимацию запускаем, когда приложение уже нарисовало первый экран; на случай сбоя заставка уберётся сама */
(function(){
  var sp=document.getElementById("splash");
  if(!sp)return;
  function done(){if(sp.parentNode)sp.parentNode.removeChild(sp)}
  if(document.documentElement.classList.contains("no-splash")){done();return}
  sp.addEventListener("animationend",function(e){if(e.target===sp)done()});
  function go(){sp.classList.add("go")}
  requestAnimationFrame(function(){requestAnimationFrame(go)});
  setTimeout(done,3500);
})();
</script>
</body>
</html>
